limit_req_zone $binary_remote_addr zone=dbaops:10m rate=10r/m;

server {
    listen 8443 ssl;
    server_name dbaops.example.internal;

    ssl_certificate /etc/pki/tls/certs/dbaops.crt;
    ssl_certificate_key /etc/pki/tls/private/dbaops.key;
    ssl_protocols TLSv1.2;
    client_max_body_size 16k;

    location / {
        limit_req zone=dbaops burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 660s;
        proxy_send_timeout 30s;
    }
}
