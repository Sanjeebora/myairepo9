# Copy to config.yaml and edit. ${VAR} and ${VAR:-default} are read from the environment / .env.

jumpserver:
  host: jumpserver.example.com
  port: 22
  username: ${JUMP_USER}
  key_file: ~/.ssh/id_rsa           # or leave out and set password_env
  # password_env: JUMP_PASSWORD     # name of the env var holding the password
  # key_passphrase_env: JUMP_KEY_PASSPHRASE
  known_hosts: ~/.ssh/known_hosts
  auto_add_host_key: false          # keep false in production; add the host key to known_hosts first
  connect_timeout: 15
  login_shell: true                 # run commands via `bash -lc` so ccps and PATH from profiles are available
  # Switch to the oracle login account before ccps, then run ccps and each ssh as that user.
  # The agent uses `sudo su - oracle -c '<command>'`. A bare `sudo su - oracle` would wait
  # for keyboard input. sudo must not prompt for a password. Set to "" to skip the switch.
  become: sudo su - oracle

ccps:
  command: ccps
  # once:        run ccps once after connecting (it must exit 0), then run scripts.
  # per_command: run ccps in the same shell before every ssh to a target. Use this if
  #              ccps only sets up the current shell (e.g. starts an ssh-agent).
  mode: once
  timeout: 120

# How the jumpserver reaches each target after ccps has enabled passwordless login.
target_ssh:
  user: oracle                      # default remote user; can be overridden per server
  options: ["-o", "BatchMode=yes", "-o", "ConnectTimeout=10"]

servers:
  - name: proddb01
    host: proddb01.internal
    tags: [prod, oracle]
  - name: proddb02
    host: proddb02.internal
    tags: [prod, oracle]
  - name: uatdb01
    host: uatdb01.internal
    user: dbadmin
    tags: [uat]

# Allowlist. The same path is used on every server. The agent can only run scripts listed here.
# --pass-hostname (or the web checkbox) appends the target hostname after these args.
scripts:
  showsid:
    description: Show the Oracle SID
    remote_path: /dba/bin/showsid
    timeout: 120
  showusers:
    description: Show database users
    remote_path: /dba/bin/showusers
    timeout: 120
  dba_checkout:
    description: Daily DBA health checkout
    remote_path: /dba/bin/dba_checkout
    timeout: 600
  start_oracle:
    description: Start Oracle
    remote_path: /dba/bin/start_oracle
    timeout: 600
  maint_mode:
    description: Maintenance mode
    remote_path: /dba/bin/maint_mode.sh
    args: ["-s"]                  # fixed flags stay in front of the hostname
    timeout: 300

llm:
  provider: openai                  # "openai" = OpenAI or any OpenAI-compatible API; "azure" = Azure OpenAI
  model: gpt-4o                     # or your Azure deployment name / local model name
  # base_url: https://your-llm-gateway.example.com/v1   # for OpenAI-compatible gateways; Azure endpoint for azure
  # api_version: 2024-06-01                             # required for azure
  api_key_env: LLM_API_KEY          # name of the env var holding your API key (do not put the key here)
  temperature: 0.1
  json_mode: true                   # set false if your endpoint does not support response_format
  max_chars_per_output: 20000

max_parallel: 5
reports_dir: reports

# Extra regexes whose matches are replaced with [REDACTED] before output reaches the LLM or the report.
redact_patterns: []
